[package]
name = "alloy-cli"
version = "0.1.0"
edition = "2021"
description = "Thin-client CLI for the Alloy engineering-intent backend"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "alloy"
path = "src/main.rs"

[lib]
name = "alloy_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# (in-memory fakes live in-crate; no extra deps needed)

[profile.release]
strip = true
lto = true
