name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elixir:
    name: Elixir quality gate
    runs-on: ubuntu-latest

    # `mix quality` runs in the :test env (see cli: preferred_envs in mix.exs),
    # so it needs a database. These env vars are read by config/test.exs.
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # format --check-formatted, compile --warnings-as-errors,
      # credo --strict, sobelow --config, test (with ecto setup).
      - name: Quality gate
        run: mix quality

      - name: Dependency vulnerability audit
        run: mix deps.audit

      - name: Retired package audit
        run: mix hex.audit

      - name: Dialyzer
        run: mix dialyzer

  docs:
    name: Docs build (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # VitePress lastUpdated reads git history

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds with ignoreDeadLinks: false, so a broken [[wikilink]] fails CI.
      - name: Build docs
        run: bun run docs:build
