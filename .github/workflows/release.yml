name: Release

# Tag-triggered: pushing a `vX.Y.Z` tag cross-compiles the `alloy` CLI for each
# supported platform and attaches the binaries (plus a SHA256SUMS file) to a
# GitHub Release. The tag's version must match `cli/Cargo.toml` so the shipped
# binary's `--version` is truthful.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag version equals cli/Cargo.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate="$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match cli/Cargo.toml version $crate — bump the crate version before tagging"
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: alloy-darwin-arm64
            bin: alloy
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: alloy-darwin-x64
            bin: alloy
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: alloy-linux-x64
            bin: alloy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: alloy-windows-x64.exe
            bin: alloy.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect binaries and checksums
        shell: bash
        run: |
          mkdir -p release
          # download-artifact v4 nests each artifact under its own directory.
          find dist -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/alloy-darwin-arm64
            release/alloy-darwin-x64
            release/alloy-linux-x64
            release/alloy-windows-x64.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
