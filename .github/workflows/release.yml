name: Release

# Tag-triggered: pushing a `vX.Y.Z` tag cross-compiles the `alloy` CLI for each
# supported platform, attaches the binaries (Unix as `.tar.gz`, Windows as a raw
# `.exe`) plus a SHA256SUMS file to a GitHub Release, and updates the shared
# svetzal/homebrew-tap formula. The tag's version must match `cli/Cargo.toml` so
# the shipped binary's `--version` is truthful.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag version equals cli/Cargo.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate="$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match cli/Cargo.toml version $crate — bump the crate version before tagging"
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: alloy-darwin-arm64
            bin: alloy
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: alloy-darwin-x64
            bin: alloy
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: alloy-linux-x64
            bin: alloy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: alloy-windows-x64.exe
            bin: alloy.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.shas.outputs.version }}
      sha_arm64: ${{ steps.shas.outputs.sha_arm64 }}
      sha_x64: ${{ steps.shas.outputs.sha_x64 }}
      sha_linux: ${{ steps.shas.outputs.sha_linux }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package binaries and compute checksums
        id: shas
        shell: bash
        run: |
          mkdir -p release
          # download-artifact v4 nests each artifact under its own directory.
          find dist -type f -exec cp {} release/ \;
          cd release

          # Homebrew needs tarballs (raw binaries don't unpack reliably); each
          # archive holds the single artifact-named binary, no path prefix.
          for name in alloy-darwin-arm64 alloy-darwin-x64 alloy-linux-x64; do
            tar -czf "$name.tar.gz" "$name"
            rm "$name"
          done

          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          sha() { sha256sum "$1" | cut -d ' ' -f 1; }
          {
            echo "version=${GITHUB_REF#refs/tags/v}"
            echo "sha_arm64=$(sha alloy-darwin-arm64.tar.gz)"
            echo "sha_x64=$(sha alloy-darwin-x64.tar.gz)"
            echo "sha_linux=$(sha alloy-linux-x64.tar.gz)"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/alloy-darwin-arm64.tar.gz
            release/alloy-darwin-x64.tar.gz
            release/alloy-linux-x64.tar.gz
            release/alloy-windows-x64.exe
            release/SHA256SUMS.txt
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Skip pre-releases (e.g. v0.2.0-rc1): the `-` marks a pre-release tag.
    if: ${{ !contains(github.ref, '-') }}

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: svetzal/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write Formula/alloy.rb
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_ARM64: ${{ needs.release.outputs.sha_arm64 }}
          SHA_X64: ${{ needs.release.outputs.sha_x64 }}
          SHA_LINUX: ${{ needs.release.outputs.sha_linux }}
        run: |
          cat > homebrew-tap/Formula/alloy.rb << FORMULA
          # typed: false
          # frozen_string_literal: true

          class Alloy < Formula
            desc "Thin-client CLI for capturing and refining engineering intent"
            homepage "https://github.com/svetzal/alloy"
            version "${VERSION}"
            license "LicenseRef-Proprietary"

            on_macos do
              on_arm do
                url "https://github.com/svetzal/alloy/releases/download/v#{version}/alloy-darwin-arm64.tar.gz"
                sha256 "${SHA_ARM64}"

                def install
                  bin.install "alloy-darwin-arm64" => "alloy"
                end
              end

              on_intel do
                url "https://github.com/svetzal/alloy/releases/download/v#{version}/alloy-darwin-x64.tar.gz"
                sha256 "${SHA_X64}"

                def install
                  bin.install "alloy-darwin-x64" => "alloy"
                end
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/svetzal/alloy/releases/download/v#{version}/alloy-linux-x64.tar.gz"
                sha256 "${SHA_LINUX}"

                def install
                  bin.install "alloy-linux-x64" => "alloy"
                end
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/alloy --version")
            end
          end
          FORMULA

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/alloy.rb
          if git diff --staged --quiet; then
            echo "Formula unchanged — nothing to commit."
          else
            git commit -m "Update alloy to ${{ needs.release.outputs.version }}"
            git push
          fi
